# Ausliefern der von vite-ssg erzeugten statischen Dateien.
#
# Kein TLS und kein Redirect hier: davor sitzt Traefik, das beides erledigt.
# Dieser Server hoert nur auf 80 im internen Docker-Netz.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kein Zugriffsprotokoll. Die Seite setzt keine Cookies und zaehlt keine
    # Besucher; dann sollen auch keine Adressen und Pfade mitlaufen. Fehler
    # werden weiter protokolliert, die braucht man zur Fehlersuche.
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Version verrraet nichts ueber die Seite, hilft aber beim Abklopfen.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Ohne includeSubDomains und ohne preload: beides waere fuer lange Zeit
    # nicht zurueckzunehmen und die Subdomains gehoeren nicht alle hierher.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # vite-ssg legt fuer jede Route eine echte HTML-Datei ab (/ und /legal).
    # Deshalb KEIN Rueckfall auf index.html: eine unbekannte Adresse soll 404
    # antworten und nicht mit Status 200 die Startseite ausliefern. Das
    # entspricht dem Verhalten des bisherigen Workers (not_found_handling).
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Assets tragen einen Hash im Namen und koennen daher unbegrenzt liegen
    # bleiben.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Bilder und Schriften aus public/ haben keinen Hash – kuerzer halten,
    # damit ein ausgetauschtes Portrait auch ankommt.
    location ~* \.(png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Fuer den Healthcheck des Containers. Beantwortet Traefik nie, weil es
    # kein Router-Ziel ist.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
