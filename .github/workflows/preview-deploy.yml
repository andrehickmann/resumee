name: Preview Deploy (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build
        run: npm run build

      - name: Deploy preview to Cloudflare
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: resumee-pr-${{ github.event.pull_request.number }}
        run: |
          npx wrangler deploy --name "$PREVIEW_NAME"
          echo "preview_name=$PREVIEW_NAME" >> "$GITHUB_OUTPUT"
        id: deploy

      - name: Skip preview deploy
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: echo "Cloudflare preview secrets are not available; skipping preview deploy."

      - name: Comment preview URL
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const previewName = '${{ steps.deploy.outputs.preview_name }}';
            const url = `https://${previewName}.andre-hickmann-ger.workers.dev`;
            const body = `✅ Preview deploy ready: ${url}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # Each preview deploy creates its own Worker. Without this job they pile up
  # until the account hits Cloudflare's limit of 100 Workers and no further
  # preview can be created.
  delete-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Delete preview Worker
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: resumee-pr-${{ github.event.pull_request.number }}
        run: |
          # The API call is cheaper than installing wrangler for a single
          # delete. A closed pull request may never have had a preview, so a
          # missing Worker is a normal outcome and not a failure.
          status=$(curl -sS -o response.json -w '%{http_code}' -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PREVIEW_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          cat response.json
          echo
          case "$status" in
            200) echo "Deleted $PREVIEW_NAME." ;;
            404) echo "No Worker named $PREVIEW_NAME; nothing to delete." ;;
            *) echo "Unexpected HTTP $status from the Cloudflare API."; exit 1 ;;
          esac

      - name: Skip preview cleanup
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: echo "Cloudflare preview secrets are not available; skipping preview cleanup."
