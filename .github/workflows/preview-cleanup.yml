name: Preview Cleanup (manual)

# Removes leftover preview Workers. preview-deploy.yml tears a Worker down when
# its pull request closes, but Workers from before that teardown existed - or
# left behind by a cancelled run - stay until removed here. Cloudflare's free
# plan allows 100 Workers per account; once that is reached no further preview
# can be deployed.
#
# Run with mode 'list' first: it only reports. Only mode 'delete' removes
# anything, and neither mode touches a Worker whose pull request is still open.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list reports only, delete removes the Workers'
        type: choice
        options:
          - list
          - delete
        default: list

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-cleanup

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Collect and remove stale preview Workers
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"

          status=$(curl -sS -o scripts.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")
          if [ "$status" != "200" ]; then
            echo "::error::Listing Workers failed with HTTP $status"
            jq -r '.errors // .' scripts.json
            exit 1
          fi

          total=$(jq '.result | length' scripts.json)
          echo "Workers in the account: $total"

          # Only ever consider this project's preview Workers. Anything else in
          # the account belongs to someone else and is left alone.
          mapfile -t previews < <(jq -r '.result[].id | select(test("^resumee-pr-[0-9]+$"))' scripts.json | sort -V)
          echo "Preview Workers of this project: ${#previews[@]}"
          echo

          stale=()
          for name in "${previews[@]}"; do
            number=${name##*-}
            # A pull request that no longer exists leaves its Worker orphaned, so
            # treat a failed lookup as "not open" rather than aborting the run.
            state=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq .state 2>/dev/null || echo missing)
            case "$state" in
              open) echo "  keep   $name (pull request is open)" ;;
              *)    echo "  stale  $name (pull request $state)"; stale+=("$name") ;;
            esac
          done

          echo
          echo "Stale: ${#stale[@]} of ${#previews[@]}"

          if [ "$MODE" != "delete" ]; then
            echo "Mode is '$MODE' - nothing deleted. Re-run with mode 'delete' to remove them."
            exit 0
          fi

          failed=0
          for name in "${stale[@]}"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$name")
            case "$code" in
              200) echo "  deleted $name" ;;
              404) echo "  gone    $name (already absent)" ;;
              *)   echo "::error::Deleting $name failed with HTTP $code"; failed=1 ;;
            esac
          done

          remaining=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq '.result | length')
          echo
          echo "Workers left in the account: $remaining"
          exit "$failed"

      - name: Report missing secrets
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set."
          exit 1
