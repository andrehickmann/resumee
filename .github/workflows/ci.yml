name: CI

permissions:
  contents: read
  packages: read

# Nur bei Pull Requests. Vorher stand hier zusaetzlich ein push-Trigger, und beide
# feuerten fuer denselben Commit: jeder Branch mit offenem PR lief zweimal durch
# Lint, Typecheck, Tests und Build. Vor einem Merge laeuft die Pruefung ohnehin
# ueber den PR, ein zweiter Lauf sagt nichts Neues.
on:
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          npm-version: 'latest'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_UNDER_CONSTRUCTION: false
