name: Release Deploy (vServer)

# Greift, wenn ein Release von Hand oder ueber einen persoenlichen Token
# veroeffentlicht wird. Der uebliche Weg laeuft ueber publish-release.yml, das
# selbst deployt – siehe die Begruendung dort.

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Use Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate release tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          ACTUAL_TAG="${{ github.event.release.tag_name }}"
          if [ "$EXPECTED_TAG" != "$ACTUAL_TAG" ]; then
            echo "Release tag $ACTUAL_TAG does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

  deploy:
    needs: validate
    uses: ./.github/workflows/vserver-deploy.yml
    with:
      ref: ${{ github.event.release.tag_name }}
    secrets: inherit
