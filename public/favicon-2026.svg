<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#06070c"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="700" fill="#5fe0ff" text-anchor="middle">
    <text x="50" y="72">
      A
      <animate attributeName="opacity" values="1;0;0;0;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="72">
      H
      <animate attributeName="opacity" values="0;1;0;0;0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="72">
      K
      <animate attributeName="opacity" values="0;0;1;0;0" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
